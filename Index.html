<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Social Universe</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #25345c, #080b18 70%);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 35px 25px;
    text-align: center;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 28px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.5);
}

.profile {
    width: 115px;
    height: 115px;
    border-radius: 50%;
    border: 3px solid #8ca8ff;
    margin-bottom: 20px;
}

h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

.subtitle {
    color: #b8c2df;
    font-size: 14px;
    margin-bottom: 30px;
}

.social {
    display: block;
    padding: 17px;
    margin: 15px 0;
    border-radius: 15px;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.facebook {
    background: #1877f2;
}

.messenger {
    background: linear-gradient(45deg,#006aff,#b52cff);
}

.instagram {
    background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf);
}

.twitter {
    background: #222;
    border: 1px solid #555;
}

footer {
    margin-top: 30px;
    color: #8993ad;
    font-size: 12px;
}
</style>
</head>

<body>
<div class="container">

<img class="profile"
src="https://via.placeholder.com/150"
alt="Profile">

<h1>My Universe</h1>
<p class="subtitle">Welcome To My Social World ✨</p>

<a class="social facebook"
href="https://www.facebook.com/share/18QhghAjth/"
target="_blank">🔵 Facebook</a>

<a class="social messenger"
href="https://m.me/spiritexp"
target="_blank">💬 Messenger</a>

<a class="social instagram"
href="https://www.instagram.com/un_known.face/"
target="_blank">📸 Instagram</a>

<a class="social twitter"
href="https://x.com/un_knownface"
target="_blank">𝕏 Twitter / X</a>

<footer>
© 2026 My Universe
<br><br>
Designed With ❤️
</footer>

</div>
</body>
</html>
